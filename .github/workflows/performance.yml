name: Performance regression checks

on:
  push:
    branches: [main, 'perf/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact geometry, resource and lifecycle regression checks
        run: |
          node tools/perf-render-test.mjs
          node tools/perf-terrain-test.mjs
          node tools/perf-resources-hand.mjs
          node tools/perf-resources-crowd.mjs
          node tools/perf-hq-test.mjs
          node tools/test-lamp-lifecycle.mjs
          node tools/perf-geometry.mjs --baseline-ref 695456732c1d93db67268d13b7367cca76783aee --out qa/performance/geometry.json
          node tools/perf-ray-model.mjs --out qa/performance/rays.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometry-regression-report
          path: qa/performance/
          retention-days: 14
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install the existing SVG build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: build/perf-baseline
      - name: Measure the published baseline
        run: |
          git -C build/perf-baseline rev-parse HEAD
          node tools/perf-scene.mjs build/perf-baseline/unified-plugin rishon qa/baseline
          node tools/perf-scene.mjs build/perf-baseline/unified-plugin sheni qa/baseline
      - name: Build both houses and the unified plugin
        run: |
          npm run build
          node tools/build-sheni.mjs --house build/sheni/house
          node tools/build-unified.mjs --sheni build/sheni/house --no-pack
      - name: Scene and resource reports
        run: |
          node tools/perf-scene.mjs dist-unified/plugin rishon qa/performance
          node tools/perf-scene.mjs dist-unified/plugin sheni qa/performance
      - name: Unified plugin regression checks
        run: |
          standalone="$(node -e "console.log('dist-unified/' + require('node:fs').readdirSync('dist-unified').find(f => f.endsWith('.html')))" )"
          node tools/qa-unified.mjs dist-unified/plugin --shots qa/unified --standalone "$standalone"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-and-browser-report
          path: qa/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: verified-built-plugin
          path: |
            dist-unified/plugin/
            plugin/bundle.js
          retention-days: 14
